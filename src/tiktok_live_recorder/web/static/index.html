<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Live Recorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Operator dashboard</p>
          <h1>TikTok Live Recorder</h1>
        </div>
        <div class="topbar-actions">
          <form id="add-user-form" class="inline-form">
            <input
              id="add-user-input"
              type="text"
              placeholder="Add @username"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="btn btn-primary">Add user</button>
          </form>
          <button id="force-poll-btn" class="btn btn-ghost">Force check</button>
          <button id="settings-toggle" class="btn btn-ghost">Settings</button>
        </div>
      </header>

      <section class="panel status-panel">
        <div class="panel-head">
          <h2>Live status</h2>
          <p id="status-meta" class="meta">Loading…</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>State</th>
                <th>Room</th>
                <th>Elapsed</th>
                <th>Size</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="status-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel library-panel">
        <div class="panel-head">
          <div>
            <h2>Media library</h2>
            <p id="library-summary" class="meta">Loading…</p>
          </div>
          <button id="refresh-media-btn" class="btn btn-ghost">Refresh</button>
        </div>
        <div class="library-toolbar">
          <input
            id="media-search"
            type="search"
            placeholder="Search by username or filename…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div id="media-player" class="media-player hidden">
          <div class="media-player-head">
            <div>
              <p class="eyebrow">Now playing</p>
              <h3 id="player-title" class="player-title"></h3>
              <p id="player-meta" class="meta"></p>
            </div>
            <button id="player-close" class="btn btn-ghost btn-small" type="button">
              Close
            </button>
          </div>
          <video id="media-player-video" controls preload="metadata"></video>
        </div>
        <div id="media-library" class="media-library"></div>
      </section>

      <section id="settings-panel" class="panel settings-panel hidden">
        <div class="panel-head">
          <h2>Settings</h2>
          <p class="meta">Writes directly to config files on save.</p>
        </div>
        <div class="settings-grid">
          <div class="settings-card">
            <h3>Cookies</h3>
            <textarea id="cookies-editor" rows="8" spellcheck="false"></textarea>
            <button id="save-cookies-btn" class="btn btn-primary">Save cookies</button>
          </div>
          <div class="settings-card">
            <h3>Telegram</h3>
            <textarea id="telegram-editor" rows="8" spellcheck="false"></textarea>
            <button id="save-telegram-btn" class="btn btn-primary">Save telegram</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
